name: OSV dependency scan

on:
  pull_request:
  push:
    # Restrict push scans to the protected integration branch; branch
    # protection itself remains repository configuration, not workflow state.
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# No SARIF upload or external writes. Proof refusal and vulnerability reporting
# fail the same check; expiry must never turn into a successful skipped scan.
permissions:
  contents: read

jobs:
  osv:
    name: Scan committed dependency locks
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          check-latest: false
          package-manager-cache: false
      - name: Install exact locked dependencies without scripts
        run: |
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Refuse expired or changed temporary exception
        run: |
          node scripts/check-http-cache-exception.mjs
          node --test test/http-cache-semantics-security.test.js test/electron-windows-production-signing.test.js test/http-cache-exception.test.js test/http-cache-exception-workflow.test.mjs
      # The reviewed binary digest fixes executable bytes. Direct invocation
      # preserves vulnerability, no-package, config and operational failures.
      - name: Run scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner="${RUNNER_TEMP}/osv-scanner-2.5.1.exe"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 15 --max-time 120 \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_windows_amd64.exe \
            --output "$scanner"
          printf '%s  %s\n' '25e42f5ef6711fd8c0fb45390972205891dd44c6bd02ac93f0f63e8e98d9bfb6' "$scanner" | sha256sum --check --strict
          chmod 0700 "$scanner"
          "$scanner" scan source --all-vulns --recursive ./
