name: Bug report
description: Report a problem with the local Rhetrion app or dashboard.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use a synthetic, content-free reproduction. This unpublished product has
        no configured private reporting channel. Do not post security details,
        credentials or private records publicly; see SECURITY.md.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: From Settings → About or the menu bar item (for example, vX.Y.Z).
      placeholder: vX.Y.Z
    validations:
      required: true
  - type: dropdown
    id: install-channel
    attributes:
      label: Install channel
      options:
        - Built from source
        - Preview / development build
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system and exact build
      description: Include the Windows edition and build number (for example from `winver`).
      placeholder: Windows 11 Home 10.0.26200
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - Windows (x64)
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: installation-history
    attributes:
      label: Installation history
      options:
        - Updated over an older Rhetrion version
        - Fresh install with no previous Rhetrion version
        - Reinstalled the same version
        - Not sure
    validations:
      required: true
  - type: input
    id: previous-version
    attributes:
      label: Previous app version
      description: If this was an update, give the last Rhetrion version that opened successfully.
      placeholder: vX.Y.Z or not applicable
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Use redacted or synthetic examples only.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: |
        What happened instead. If relevant, include output from the built-in
        diagnostics: `npm run diagnose:dashboard` from a source checkout.
        If startup shows a fixed support code, include that code. Review all
        diagnostics and screenshots for private data before sharing.
    validations:
      required: true
  - type: checkboxes
    id: no-session-content
    attributes:
      label: Content check
      options:
        - label: This report contains no prompts, model responses, or real file paths from coding-agent sessions.
          required: true
