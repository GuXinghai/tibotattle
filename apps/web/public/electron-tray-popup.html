<!doctype html>
<html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
<title>Rhetrion</title><link rel="stylesheet" href="./electron-tray-popup.css">
<script type="module" src="./electron-tray-popup.js" defer></script></head>
<body data-i18n-root><main class="electron-tray-popup" id="tray-popup" aria-labelledby="tray-popup-title">
<header><h1 id="tray-popup-title" data-i18n="electron.trayCompact.title">Remaining allowance</h1><span id="tray-popup-freshness" role="status"></span></header>
<section class="tray-allowances" aria-labelledby="tray-popup-title"><div id="allowance-lanes"></div><p id="allowance-unavailable" role="status" hidden></p></section>
<section class="tray-metrics" aria-label="API-equivalent rates" data-i18n-aria-label="electron.trayCompact.rates">
<div><h2 data-i18n="electron.trayCompact.shortTerm">Short-term · 15 min</h2><strong class="tray-level" id="tray-short-level">—</strong><p class="tray-rate"><span id="tray-short-value">—</span> <span class="tray-unit" data-i18n="electron.trayCompact.unit">API equiv. /h</span></p></div>
<div><h2 data-i18n="electron.trayCompact.trend">Quota trend · 60 min</h2><strong class="tray-level" id="tray-trend-level">—</strong><p class="tray-rate"><span id="tray-trend-value">—</span> <span class="tray-unit" data-i18n="electron.trayCompact.unit">API equiv. /h</span></p></div>
</section><button type="button" class="tray-open" data-action="open"><span id="tray-popup-open-label" data-i18n="electron.trayCompact.open">Open main window</span></button>
<p class="sr-only" id="tray-popup-live" role="status" aria-live="polite"></p>
</main></body></html>
